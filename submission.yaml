submission:
  title: "RapidDeploy — Supply Chain & Cold-Chain Operations Dashboard"  # REQUIRED

  problem_statement: >                             # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain and cold-chain logistics teams struggle to monitor temperature-sensitive
    shipments in real time, detect IoT excursions before product damage occurs, and correlate
    fleet idle time, disruption events, and delayed shipments in a single view.
    Operations managers and fleet coordinators currently rely on disconnected tools,
    leading to delayed responses to critical events such as reefer failures or port congestion.

  solution_summary: >                             # REQUIRED — 1-3 sentences. What did you build?
    RapidDeploy is a real-time supply chain and cold-chain monitoring dashboard built with
    FastAPI and a vanilla HTML/JS frontend. It simulates a live IoT sensor network across
    10 active shipments, streaming temperature and humidity readings over WebSocket every 5 seconds,
    and surfaces KPI summaries, fleet status, temperature excursion alerts, and supply-chain
    disruption events — all in a single unified dashboard with sortable tables and live charts.

  key_features:                                   # REQUIRED — List 3 to 5 specific features
    - "Real-time IoT telemetry streaming via WebSocket (/ws/telemetry) with live temperature line chart and category donut chart updating every 5 seconds"
    - "Temperature excursion detection per product category (frozen, refrigerated, pharma, ambient) with automatic alert generation and one-click acknowledgement"
    - "Interactive Active Shipments table with click-to-sort on 9 columns (ID, product, category, carrier, status, temperature, progress, ETA, excursion)"
    - "Supply-chain disruption event tracking with impact score bars, affected shipment linkage, and active/resolved filter"
    - "Aggregated KPI overview with fleet utilisation, idle vehicle count, critical alert count, and 30-second polling refresh"

  tech_stack:
    languages: ["Python", "HTML", "CSS", "JavaScript"]
    frameworks: ["FastAPI", "Pydantic", "pytest", "Leaflet.js", "Apache ECharts"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["WebSocket", "Uvicorn", "CORS Middleware", "CartoDB tile layer"]

  what_we_are_most_proud_of: >                    # Optional but recommended
    The end-to-end real-time telemetry pipeline: a background asyncio task emits simulated
    IoT sensor readings every 5 seconds and broadcasts them over WebSocket to all connected
    clients simultaneously. The Live Telemetry tab pre-seeds itself instantly from the REST API
    on first open, then seamlessly continues with live WS updates — giving users immediate
    visibility into the current cold-chain state without waiting for the next push cycle.
    The sortable shipments table and the clean separation of static seed data (via the
    refactored _DISRUPTION_SPECS data table) from rendering logic were also highlights.

  known_limitations: >                            # Optional but recommended
    All shipment, fleet, alert, and disruption data is simulated in-memory at startup using
    a seeded RNG — there is no persistent database or real IoT device integration.
    The IoT telemetry is randomly generated rather than sourced from actual sensors.
    Authentication and authorisation are not implemented; all API endpoints are open.
    The dashboard has been tested on Chrome and Edge; mobile layout is functional but
    not fully optimised for small screens.

